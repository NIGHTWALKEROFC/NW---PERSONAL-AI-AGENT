<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in — NightWalker</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main style="max-width: 400px; margin: 80px auto;">
        <h1 style="text-align:center;">NightWalker</h1>
        <div class="card">
            <h3>Log in</h3>
            {% if error %}
            <p><span class="badge badge-danger">{{ error }}</span></p>
            {% endif %}
            <form method="post" action="/login">
                <input type="hidden" name="next" value="{{ next }}">
                <p>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password" autofocus required style="width: 100%; padding: 8px; margin-top: 4px;">
                </p>
                <button type="submit">Log in</button>
            </form>
            <p class="muted" style="margin-top: 16px;">Forgot it? Run <code>python scripts/set_dashboard_password.py</code> on the laptop itself to set a new one.</p>
        </div>
    </main>
</body>
</html>
